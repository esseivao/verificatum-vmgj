name: CI - VMGJ

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  GMPMEE_REPOSITORY: https://github.com/verificatum/verificatum-gmpmee.git

jobs:
  # ====================== Linux + macOS ======================
  unix:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        compiler: [ gcc, clang ]
        build_type: [ Debug, Release ]
        include:
          - os: ubuntu-latest
            compiler: clang
            build_type: Debug
            sanitizer: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            git \
            libgmp-dev \
            maven \
            ninja-build \
            python3

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew update
          brew install cmake gmp maven ninja python

      - name: Build and install GMPMEE
        shell: bash
        run: |
          set -euo pipefail

          deps_prefix="${RUNNER_TEMP}/vmgj-deps"
          gmpmee_src="${RUNNER_TEMP}/gmpmee-src"
          gmpmee_build="${RUNNER_TEMP}/gmpmee-build"

          git clone --depth 1 "${GMPMEE_REPOSITORY}" "${gmpmee_src}"

          cmake_args=(
            -S "${gmpmee_src}"
            -B "${gmpmee_build}"
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_SHARED_LIBS=ON
            -DCMAKE_INSTALL_PREFIX="${deps_prefix}"
            -DCMAKE_C_COMPILER="${{ matrix.compiler }}"
          )

          if [[ "${{ matrix.os }}" == macos* ]]; then
            cmake_args+=("-DCMAKE_PREFIX_PATH=$(brew --prefix gmp)")
          fi

          cmake "${cmake_args[@]}"
          cmake --build "${gmpmee_build}"
          cmake --install "${gmpmee_build}"

          echo "CMAKE_PREFIX_PATH=${deps_prefix}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${deps_prefix}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"
          echo "DYLD_LIBRARY_PATH=${deps_prefix}/lib${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"

      - name: Maven package
        env:
          CC: ${{ matrix.compiler }}
        run: |
          mvn -B package \
            -Dcmake.build.type=${{ matrix.build_type }} \
            -Dcmake.enable.sanitizers=${{ matrix.sanitizer == true }}

      - name: Smoke test packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          libdir="target/cmake-build/${{ matrix.build_type }}"
          if [[ ! -d "${libdir}" ]]; then
            libdir="target/cmake-build"
          fi
          java -ea \
            -Djava.library.path="${libdir}:${RUNNER_TEMP}/vmgj-deps/lib" \
            -cp target/vmgj-1.4.0.jar \
            com.verificatum.vmgj.TestVMG 256

      - name: Upload Maven artifacts
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: vmgj-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            target/*.jar
            target/classes/META-INF/native/**
          retention-days: 30

  # ====================== Code Quality + Coverage ======================
  quality:
    name: Code Quality & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-tidy \
            cmake \
            cppcheck \
            git \
            lcov \
            libgmp-dev \
            maven \
            ninja-build \
            python3

      - name: Build and install GMPMEE
        shell: bash
        run: |
          set -euo pipefail

          deps_prefix="${RUNNER_TEMP}/vmgj-deps"
          git clone --depth 1 "${GMPMEE_REPOSITORY}" "${RUNNER_TEMP}/gmpmee-src"
          cmake -S "${RUNNER_TEMP}/gmpmee-src" \
            -B "${RUNNER_TEMP}/gmpmee-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="${deps_prefix}" \
            -DCMAKE_C_COMPILER=clang
          cmake --build "${RUNNER_TEMP}/gmpmee-build"
          cmake --install "${RUNNER_TEMP}/gmpmee-build"

          echo "CMAKE_PREFIX_PATH=${deps_prefix}" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${deps_prefix}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"

      - name: Maven package with coverage flags
        env:
          CC: clang
        run: |
          mvn -B package \
            -Dcmake.build.type=Debug \
            -Dcmake.enable.coverage=ON

      - name: Run VMGJ smoke test
        run: |
          java -ea \
            -Djava.library.path="target/cmake-build/Debug:${RUNNER_TEMP}/vmgj-deps/lib" \
            -cp target/vmgj-1.4.0.jar \
            com.verificatum.vmgj.TestVMG 256

      - name: Generate lcov Coverage Report
        run: |
          echo "=== Coverage data files ==="
          find target/cmake-build -name '*.gcno' -o -name '*.gcda'
          lcov --capture \
            --directory target/cmake-build \
            --base-directory . \
            --output-file target/coverage.raw.info
          lcov --remove target/coverage.raw.info \
            '/usr/*' \
            '*/target/*/CMakeFiles/*' \
            --ignore-errors unused \
            --output-file target/coverage.info
          lcov --list target/coverage.info
          genhtml target/coverage.info \
            --output-directory target/coverage-report \
            --title "VMGJ Native Code Coverage"

      - name: Run clang-tidy through CMake
        env:
          CC: clang
        run: |
          cmake -S . \
            -B target/cmake-tidy \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/vmgj-deps" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_CLANG_TIDY=clang-tidy
          cmake --build target/cmake-tidy --target vmgj --verbose 2>&1 | tee target/clang-tidy.log

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --inconclusive --std=c11 \
            -I native \
            -I target/cmake-build/generated/native \
            -I "${JAVA_HOME}/include" \
            -I "${JAVA_HOME}/include/linux" \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=variableScope \
            --suppress=constParameterPointer \
            --suppress=constParameter \
            --suppress=unreadVariable \
            --suppress=knownConditionTrueFalse \
            --suppress=missingInclude \
            --suppress=unmatchedSuppression \
            --suppress=checkersReport \
            --inline-suppr \
            --quiet \
            --error-exitcode=1 \
            native/*.c native/*.h 2> target/cppcheck.txt || true

          echo "=== CPPCHECK SUMMARY ==="
          sed -i '/\[checkersReport\]/d' target/cppcheck.txt
          if [ -s target/cppcheck.txt ]; then
            echo "=== CPPCHECK FOUND ISSUES ==="
            cat target/cppcheck.txt
            exit 1
          fi
          echo "cppcheck passed cleanly."

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            target/coverage-report
            target/cppcheck.txt
            target/clang-tidy.log
            target/coverage.info
          retention-days: 30

  # ====================== Windows (MinGW-w64 GCC) ======================
  windows-mingw:
    name: Windows - MinGW-w64 GCC - ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install MinGW-w64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            maven
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python

      - name: Build and install GMPMEE
        shell: msys2 {0}
        run: |
          set -euo pipefail

          deps_prefix="${RUNNER_TEMP}/vmgj-deps"
          git clone --depth 1 "${GMPMEE_REPOSITORY}" "${RUNNER_TEMP}/gmpmee-src"
          cmake -S "${RUNNER_TEMP}/gmpmee-src" \
            -B "${RUNNER_TEMP}/gmpmee-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="${deps_prefix}" \
            -DCMAKE_C_COMPILER=gcc
          cmake --build "${RUNNER_TEMP}/gmpmee-build"
          cmake --install "${RUNNER_TEMP}/gmpmee-build"

      - name: Maven package
        shell: msys2 {0}
        env:
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/vmgj-deps
        run: |
          mvn -B package \
            -Dcmake.build.type=${{ matrix.build_type }}

      - name: Upload Maven artifacts
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: vmgj-windows-mingw
          path: |
            target/*.jar
            target/classes/META-INF/native/**
          retention-days: 30

  # ====================== FreeBSD ======================
  freebsd:
    name: FreeBSD 15.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          envs: "GMPMEE_REPOSITORY"
          usesh: true
          prepare: |
            pkg install -y cmake git gmake gmp maven ninja openjdk25 python3
          run: |
            export JAVA_HOME=/usr/local/openjdk25
            export PATH="${JAVA_HOME}/bin:${PATH}"

            deps_prefix="${RUNNER_TEMP:-/tmp}/vmgj-deps"
            git clone --depth 1 "${GMPMEE_REPOSITORY}" /tmp/gmpmee-src
            cmake -S /tmp/gmpmee-src \
              -B /tmp/gmpmee-build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_INSTALL_PREFIX="${deps_prefix}"
            cmake --build /tmp/gmpmee-build
            cmake --install /tmp/gmpmee-build

            export CMAKE_PREFIX_PATH="${deps_prefix}"
            export LD_LIBRARY_PATH="${deps_prefix}/lib:${LD_LIBRARY_PATH:-}"
            mvn -B package
